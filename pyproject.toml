[project]
name = "screech-hawkcam"
version = "2.0.0"
description = "Local AI-assisted activity tracker for the GDIT Red-shouldered Hawk cam"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "opencv-python==4.14.0.94",
    "yt-dlp[default]==2026.8.19",
    "ultralytics==8.4.138",
    "requests==2.34.2",
    "numpy==2.3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
]
clip = [
    "open-clip-torch==3.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
