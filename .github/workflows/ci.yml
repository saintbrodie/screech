name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lightweight-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall backend tools tests

      - name: Install lightweight test dependency
        run: python -m pip install "pytest>=8,<10"

      - name: Run unit tests
        run: pytest -q
